    <!--Área onde serão mostrados os itens-->


    <h1>Itens almoxarifado</h1>

    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantidade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo">
            <tr>
                <td>Livros</td>
                <td>1</td>
                <td><button>Requisitar</button></td>
            </tr>
            <tr>
                <td>Pendrives</td>
                <td>4</td>
                <td><button>Requisitar</button></td>
            </tr>
            <tr>
                <td>Carregadores</td>
                <td>10</td>
                <td><button>Requisitar</button></td>
            </tr>

        </tbody>
    </table>
    <button class="button open-add-button">Adicionar</button>


    <dialog class="add-itens-modal" id="add-itens-modal">
        <h1>Adicionar itens</h1>
        <form id="form">
            <label for="add-item-name">Nome do item</label><br>
            <input type="text" id="add-item-name" name="add-item-name"><br>

            <label for="add-item-quantity">Quantidade de itens</label><br>
            <input type="number" id="add-item-quantity" name="add-item-quantity"><br><br>
            <button type="submit" class="button conclusion-add-function">Adicionar</button>
            <button class="button end-add-function">Cancelar</button>
        </form>
    </dialog>




























    <dialog class="request-itens-modal" id="request-itens-modal">
        <h1>requisitar itens</h1>

        <label for="itemname">Nome do item</label><br>
        <input required type="text" id="itemname" name="itemname"><br>

        <label for="itemquantity">Quantidade de itens</label><br>
        <input required type="number" id=""><br><br>
        <button type="submit" class="button conclusion-add-function">Adicionar</button>
        <button class="button end-add-function">Cancelar</button>
    </dialog>






    <script src="/scripts/index.js"></script>
